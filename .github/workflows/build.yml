name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check | Build public edition
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: No private content in this repo
        run: python tools/build.py --check

      - name: App contract tests
        run: |
          pip install --quiet -r requirements-dev.txt
          python -m pytest tests -q

      - name: Build public edition
        env:
          BUILD_ID: ${{ github.sha }}
        run: |
          pip install --quiet -r requirements.txt
          python tools/build.py
          echo "### Public edition built from \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-site
          path: dist/public
          retention-days: 7
